version: '3'

services:
  postgres:
    image: postgres:15
    container_name: ndap-postgres


    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: ndap-db
   
    ports:
       - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../data:/data

volumes:
  postgres_data:  
